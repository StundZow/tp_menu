<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TP Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hidden">
    <div class="panel">
      <div class="panel-header">
        <h1>Téléportation</h1>
        <button id="closeBtn" class="close-btn" title="Fermer (ESC)">✕</button>
      </div>

      <label class="sync-row" for="syncToggle">
        <span class="sync-text">
          <span class="sync-title">Synchroniser les blips</span>
          <span id="syncHint" class="sync-hint">Masquer un joueur = masqué pour tout le monde</span>
        </span>
        <span class="switch">
          <input id="syncToggle" type="checkbox">
          <span class="slider"></span>
        </span>
      </label>

      <input id="search" type="text" placeholder="Rechercher un joueur..." autocomplete="off">

      <div id="playerList" class="player-list">
        <p class="empty-state">Aucun joueur en ligne.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
